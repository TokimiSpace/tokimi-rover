<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Tokimi Rover current system architecture</title>
  <desc id="architecture-desc">Two separate application paths: a phone connects through the Rover access point to the rover ESP32-S3 and its TB6612 motor driver, OLED, and WS2812 lights; a tablet connects through the Camera access point to an ESP32-S3-CAM and OV3660. A prominent broken link states that the two controllers have no application link.</desc>

  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071221"/>
      <stop offset=".52" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="control-lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0c2237"/>
      <stop offset="1" stop-color="#0b1a2d"/>
    </linearGradient>
    <linearGradient id="vision-lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#191d3e"/>
      <stop offset="1" stop-color="#11172f"/>
    </linearGradient>
    <pattern id="dot-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#88b9d8" fill-opacity=".1"/>
    </pattern>
    <filter id="cyan-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#09a9d3" flood-opacity=".15"/>
    </filter>
    <filter id="violet-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6d5de7" flood-opacity=".16"/>
    </filter>
    <filter id="red-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#35d8f5"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0l10 5-10 5z" fill="#9b8dff"/>
    </marker>
    <symbol id="wifi" viewBox="0 0 64 64">
      <path d="M8 24q24-21 48 0M16 34q16-14 32 0M25 44q7-6 14 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="52" r="4" fill="currentColor"/>
    </symbol>
    <symbol id="chip" viewBox="0 0 64 64">
      <rect x="14" y="14" width="36" height="36" rx="7" fill="none" stroke="currentColor" stroke-width="4"/>
      <rect x="24" y="24" width="16" height="16" rx="3" fill="currentColor" opacity=".42"/>
      <path d="M21 5v9M32 5v9M43 5v9M21 50v9M32 50v9M43 50v9M5 21h9M5 32h9M5 43h9M50 21h9M50 32h9M50 43h9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="phone" viewBox="0 0 64 64">
      <rect x="16" y="4" width="32" height="56" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
      <path d="M25 11h14M27 52h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M23 22h18v20H23z" fill="currentColor" opacity=".18"/>
    </symbol>
    <symbol id="tablet" viewBox="0 0 64 64">
      <rect x="6" y="11" width="52" height="42" rx="7" fill="none" stroke="currentColor" stroke-width="4"/>
      <rect x="14" y="18" width="34" height="28" rx="2" fill="currentColor" opacity=".18"/>
      <circle cx="53" cy="32" r="2" fill="currentColor"/>
    </symbol>
    <symbol id="camera" viewBox="0 0 64 64">
      <rect x="7" y="16" width="50" height="34" rx="8" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="32" cy="33" r="11" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="32" cy="33" r="4" fill="currentColor" opacity=".55"/>
      <path d="M17 16l6-8h18l6 8" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1600" height="900" fill="url(#page-bg)"/>
  <rect width="1600" height="900" fill="url(#dot-grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Header -->
    <text x="72" y="74" fill="#f0f7ff" font-size="34" font-weight="800" letter-spacing="-.6">CURRENT SYSTEM ARCHITECTURE</text>
    <text x="72" y="108" fill="#8da8c4" font-size="17">Audited ESP32-S3 prototype · two independent Wi-Fi application paths</text>
    <g transform="translate(1242 52)">
      <rect width="286" height="56" rx="15" fill="#0d2134" stroke="#31516c"/>
      <circle cx="27" cy="28" r="6" fill="#46e1a5"/>
      <text x="46" y="24" fill="#6d8aa5" font-size="10" font-weight="700" letter-spacing="1.5">EVIDENCE STATUS</text>
      <text x="46" y="42" fill="#d9edfa" font-size="13" font-weight="700">SOURCE-AUDITED · NOT FIELD-RETESTED</text>
    </g>

    <!-- Lane backgrounds -->
    <rect x="54" y="150" width="1492" height="322" rx="28" fill="url(#control-lane)" stroke="#1d526a" stroke-width="2"/>
    <path d="M55 198h1490" stroke="#2b647d" stroke-opacity=".38"/>
    <rect x="54" y="540" width="1492" height="274" rx="28" fill="url(#vision-lane)" stroke="#4d467d" stroke-width="2"/>
    <path d="M55 588h1490" stroke="#665b9d" stroke-opacity=".38"/>

    <!-- Lane titles -->
    <g transform="translate(78 167)">
      <rect width="148" height="30" rx="15" fill="#12364b" stroke="#2abedc" stroke-opacity=".58"/>
      <circle cx="17" cy="15" r="4" fill="#35d8f5"/>
      <text x="31" y="20" fill="#a8effa" font-size="12" font-weight="800" letter-spacing="1.6">CONTROL PLANE</text>
    </g>
    <text x="245" y="189" fill="#69869e" font-size="13">Rover AP · motor, display, and lighting control</text>

    <g transform="translate(78 557)">
      <rect width="140" height="30" rx="15" fill="#292653" stroke="#8f82eb" stroke-opacity=".64"/>
      <circle cx="17" cy="15" r="4" fill="#9b8dff"/>
      <text x="31" y="20" fill="#d1caff" font-size="12" font-weight="800" letter-spacing="1.6">VISION PLANE</text>
    </g>
    <text x="233" y="579" fill="#777493" font-size="13">Camera AP · independent capture and MJPEG service</text>

    <!-- Control flow connectors -->
    <g fill="none" stroke="#35d8f5" stroke-width="4" marker-end="url(#arrow-cyan)">
      <path d="M221 305H305"/>
      <path d="M486 305H570"/>
      <path d="M786 305H854V253H891"/>
      <path d="M1077 253h69"/>
      <path d="M786 305h68v86h37"/>
      <path d="M786 305h304v86h56"/>
    </g>
    <g fill="#79e6f8" font-size="10" font-weight="700" letter-spacing="1.2">
      <text x="249" y="294">WI-FI</text>
      <text x="506" y="294">HTTP</text>
      <text x="812" y="292">GPIO</text>
    </g>

    <!-- Phone -->
    <g transform="translate(92 234)" filter="url(#cyan-shadow)">
      <rect width="130" height="142" rx="20" fill="#0b1b2d" stroke="#326a82" stroke-width="2"/>
      <use href="#phone" x="38" y="15" width="54" height="54" color="#5ce3f8"/>
      <text x="65" y="92" fill="#ecf9ff" font-size="16" font-weight="750" text-anchor="middle">PHONE</text>
      <text x="65" y="114" fill="#7d9ab2" font-size="11" text-anchor="middle">Browser control UI</text>
      <text x="65" y="131" fill="#56738d" font-size="10" text-anchor="middle">touch / pointer</text>
    </g>

    <!-- Rover AP -->
    <g transform="translate(306 234)" filter="url(#cyan-shadow)">
      <rect width="180" height="142" rx="20" fill="#0c2033" stroke="#32b9d6" stroke-width="2"/>
      <use href="#wifi" x="62" y="11" width="56" height="56" color="#4bdef5"/>
      <text x="90" y="91" fill="#ecf9ff" font-size="16" font-weight="750" text-anchor="middle">ROVER AP</text>
      <text x="90" y="114" fill="#7d9ab2" font-size="11" text-anchor="middle">Local access point</text>
      <rect x="48" y="122" width="84" height="17" rx="8.5" fill="#102d42"/>
      <text x="90" y="134" fill="#73def0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" text-anchor="middle">192.168.4.1</text>
    </g>

    <!-- Rover controller -->
    <g transform="translate(572 219)" filter="url(#cyan-shadow)">
      <rect width="214" height="172" rx="22" fill="#0e2438" stroke="#37d4ef" stroke-width="2.5"/>
      <use href="#chip" x="77" y="16" width="60" height="60" color="#63e6fa"/>
      <text x="107" y="101" fill="#f3fbff" font-size="18" font-weight="800" text-anchor="middle">ESP32-S3</text>
      <text x="107" y="122" fill="#84a5bd" font-size="11" text-anchor="middle">Rover controller</text>
      <g transform="translate(22 138)">
        <rect width="170" height="22" rx="11" fill="#0a1b2c" stroke="#244b61"/>
        <text x="85" y="15" fill="#75dcec" font-size="10" font-weight="700" text-anchor="middle" letter-spacing=".8">MOTOR · OLED · LED API</text>
      </g>
    </g>

    <!-- Motor driver -->
    <g transform="translate(892 207)">
      <rect width="186" height="92" rx="17" fill="#10243a" stroke="#35c7e3" stroke-width="2"/>
      <path d="M20 28h30l12 18-12 18H20L8 46z" fill="#1f6175"/>
      <path d="M136 28h30l12 18-12 18h-30l-12-18z" fill="#1f6175"/>
      <text x="93" y="41" fill="#effbff" font-size="16" font-weight="800" text-anchor="middle">TB6612FNG</text>
      <text x="93" y="64" fill="#7d9ab2" font-size="11" text-anchor="middle">Dual motor driver</text>
      <text x="93" y="80" fill="#58758e" font-size="9" text-anchor="middle">A/B channels · PWM + direction</text>
    </g>

    <!-- Motors -->
    <g transform="translate(1148 207)">
      <rect width="336" height="92" rx="17" fill="#102238" stroke="#2b7390" stroke-width="2"/>
      <g transform="translate(23 16)" fill="#09121f" stroke="#5d7991" stroke-width="3">
        <circle cx="30" cy="30" r="28"/><circle cx="92" cy="30" r="28"/><circle cx="198" cy="30" r="28"/><circle cx="260" cy="30" r="28"/>
      </g>
      <g fill="#75dff1" font-size="11" font-weight="800" text-anchor="middle">
        <text x="53" y="57">M1</text><text x="115" y="57">M2</text><text x="221" y="57">M3</text><text x="283" y="57">M4</text>
      </g>
      <text x="168" y="82" fill="#69889f" font-size="10" text-anchor="middle">Two parallel motor pairs · left / right</text>
    </g>

    <!-- OLED -->
    <g transform="translate(892 347)">
      <rect width="186" height="88" rx="17" fill="#10243a" stroke="#35c7e3" stroke-width="2"/>
      <rect x="20" y="17" width="62" height="44" rx="8" fill="#06111d" stroke="#4adcf4"/>
      <ellipse cx="38" cy="39" rx="9" ry="6" fill="#62e5f8"/><ellipse cx="64" cy="39" rx="9" ry="6" fill="#62e5f8"/>
      <text x="128" y="38" fill="#effbff" font-size="16" font-weight="800" text-anchor="middle">OLED</text>
      <text x="128" y="57" fill="#7d9ab2" font-size="10" text-anchor="middle">SH1106 · I²C</text>
      <text x="93" y="78" fill="#58758e" font-size="9" text-anchor="middle">Animated face output</text>
    </g>

    <!-- WS2812 -->
    <g transform="translate(1148 347)">
      <rect width="336" height="88" rx="17" fill="#102238" stroke="#2b7390" stroke-width="2"/>
      <text x="94" y="36" fill="#effbff" font-size="16" font-weight="800" text-anchor="middle">WS2812</text>
      <text x="94" y="56" fill="#7d9ab2" font-size="10" text-anchor="middle">32 addressable LEDs</text>
      <g transform="translate(180 28)">
        <circle cx="0" cy="0" r="8" fill="#e8fbff"/><circle cx="27" cy="0" r="8" fill="#49dcfa"/>
        <circle cx="54" cy="0" r="8" fill="#8e80ff"/><circle cx="81" cy="0" r="8" fill="#ff5e90"/>
        <circle cx="108" cy="0" r="8" fill="#ffb84e"/>
      </g>
      <text x="242" y="67" fill="#69889f" font-size="9" text-anchor="middle">front · center · rear</text>
    </g>

    <!-- Absent application link -->
    <g>
      <path d="M679 391v73M679 527v72" fill="none" stroke="#ff667c" stroke-width="3" stroke-dasharray="8 9" opacity=".7"/>
      <circle cx="679" cy="495" r="24" fill="#2b1322" stroke="#ff667c" stroke-width="2" filter="url(#red-glow)"/>
      <path d="M668 484l22 22M690 484l-22 22" stroke="#ff788a" stroke-width="4" stroke-linecap="round"/>
      <rect x="738" y="477" width="492" height="38" rx="19" fill="#241421" stroke="#9b4354" stroke-width="1.5"/>
      <text x="984" y="493" fill="#ff91a0" font-size="12" font-weight="850" text-anchor="middle" letter-spacing="1.5">NO APPLICATION LINK BETWEEN CONTROLLERS</text>
      <text x="984" y="507" fill="#9c7180" font-size="9" text-anchor="middle">separate access points · separate HTTP servers · no status or frame transport</text>
    </g>

    <!-- Vision flow connectors -->
    <g fill="none" stroke="#9b8dff" stroke-width="4" marker-end="url(#arrow-violet)">
      <path d="M221 682H305"/>
      <path d="M486 682H570"/>
      <path d="M786 682H915"/>
      <path d="M1109 682h85"/>
    </g>
    <g fill="#bdb5ff" font-size="10" font-weight="700" letter-spacing="1.2">
      <text x="249" y="671">WI-FI</text>
      <text x="506" y="671">HTTP</text>
      <text x="836" y="671">CAMERA BUS</text>
    </g>

    <!-- Tablet -->
    <g transform="translate(92 617)" filter="url(#violet-shadow)">
      <rect width="130" height="130" rx="20" fill="#171a34" stroke="#6055a2" stroke-width="2"/>
      <use href="#tablet" x="34" y="12" width="62" height="62" color="#a89cff"/>
      <text x="65" y="94" fill="#f4f1ff" font-size="16" font-weight="750" text-anchor="middle">TABLET</text>
      <text x="65" y="115" fill="#9791b5" font-size="11" text-anchor="middle">Camera browser UI</text>
    </g>

    <!-- Camera AP -->
    <g transform="translate(306 617)" filter="url(#violet-shadow)">
      <rect width="180" height="130" rx="20" fill="#191d39" stroke="#7b6dd4" stroke-width="2"/>
      <use href="#wifi" x="62" y="7" width="56" height="56" color="#aa9eff"/>
      <text x="90" y="86" fill="#f4f1ff" font-size="16" font-weight="750" text-anchor="middle">CAMERA AP</text>
      <text x="90" y="108" fill="#9791b5" font-size="11" text-anchor="middle">Independent network</text>
      <text x="90" y="122" fill="#6d6889" font-size="9" text-anchor="middle">capture + MJPEG routes</text>
    </g>

    <!-- Camera controller -->
    <g transform="translate(572 602)" filter="url(#violet-shadow)">
      <rect width="214" height="160" rx="22" fill="#1b2140" stroke="#9588f0" stroke-width="2.5"/>
      <use href="#chip" x="77" y="12" width="60" height="60" color="#b4a9ff"/>
      <text x="107" y="96" fill="#f7f5ff" font-size="18" font-weight="800" text-anchor="middle">ESP32-S3-CAM</text>
      <text x="107" y="117" fill="#a09aba" font-size="11" text-anchor="middle">Camera controller</text>
      <g transform="translate(24 133)">
        <rect width="166" height="18" rx="9" fill="#11162e" stroke="#494375"/>
        <text x="83" y="13" fill="#b6adf0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing=".7">INDEPENDENT FIRMWARE</text>
      </g>
    </g>

    <!-- OV3660 -->
    <g transform="translate(916 617)">
      <rect width="194" height="130" rx="20" fill="#1a1f3b" stroke="#7d70d5" stroke-width="2"/>
      <use href="#camera" x="65" y="10" width="64" height="64" color="#afa4ff"/>
      <text x="97" y="92" fill="#f4f1ff" font-size="17" font-weight="800" text-anchor="middle">OV3660</text>
      <text x="97" y="113" fill="#9791b5" font-size="11" text-anchor="middle">Image sensor</text>
    </g>

    <!-- Camera service result -->
    <g transform="translate(1196 617)">
      <rect width="288" height="130" rx="20" fill="#171c36" stroke="#5f568f" stroke-width="2"/>
      <rect x="24" y="22" width="86" height="58" rx="10" fill="#0c1125" stroke="#776bdd"/>
      <path d="M31 68l21-22 16 15 13-11 22 18" fill="none" stroke="#a89cff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="89" cy="37" r="7" fill="#aa9eff"/>
      <text x="190" y="43" fill="#f4f1ff" font-size="15" font-weight="800" text-anchor="middle">HTTP VIDEO</text>
      <text x="190" y="64" fill="#9791b5" font-size="10" text-anchor="middle">JPEG capture · MJPEG stream</text>
      <path d="M111 51h22" stroke="#8d81dd" stroke-width="3" marker-end="url(#arrow-violet)"/>
      <rect x="41" y="94" width="206" height="22" rx="11" fill="#11162d"/>
      <text x="144" y="109" fill="#a8a1cb" font-size="9" font-weight="700" text-anchor="middle">SERVED BACK OVER CAMERA AP</text>
    </g>

    <!-- Footer legend -->
    <g transform="translate(72 850)">
      <path d="M0 0h48" stroke="#35d8f5" stroke-width="4" marker-end="url(#arrow-cyan)"/>
      <text x="62" y="5" fill="#7896ae" font-size="11">implemented control / connection path</text>
      <path d="M306 0h48" stroke="#9b8dff" stroke-width="4" marker-end="url(#arrow-violet)"/>
      <text x="368" y="5" fill="#85809f" font-size="11">independent camera path</text>
      <path d="M585 0h48" stroke="#ff667c" stroke-width="3" stroke-dasharray="7 7"/>
      <text x="648" y="5" fill="#9d7380" font-size="11">explicitly absent application link</text>
      <text x="1456" y="5" fill="#526d84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end">SOURCE AUDIT · 2026-08-19</text>
    </g>
  </g>
</svg>
